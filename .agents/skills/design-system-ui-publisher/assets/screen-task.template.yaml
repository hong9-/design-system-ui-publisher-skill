task:
  type: create-screen
  target:
    - web
    - native

screen:
  name: ExampleScreen
  recipe: list-screen
  route: /example

intent:
  primaryGoal: 사용자가 주요 정보를 확인한다
  secondaryGoal: 필요한 후속 액션을 수행한다

content:
  title: 예시 화면
  description: 화면 설명을 입력한다
  emptyTitle: 표시할 항목이 없습니다
  emptyDescription: 조건을 바꾸거나 새 항목을 추가해보세요
  errorTitle: 정보를 불러오지 못했습니다
  errorDescription: 잠시 후 다시 시도해주세요

data:
  entity: Example
  itemFields:
    - id
    - title
    - status

states:
  required:
    - loading
    - empty
    - error
    - success

actions:
  primary:
    label: 계속하기
  retry:
    label: 다시 시도

constraints:
  useOnlyDesignSystemComponents: true
  noRawStyles: true
  noNewTokens: true
  requireStories: true
  requireAccessibility: true
  requireComplianceReport: true
