task:
  type: create-screen
  target:
    - web
    - native
  deliveryMode: greenfield
  contractLevel: structured
  targetMaturity: fixture-ready

authority:
  behavior:
    sources:
      - ref: product/order-history-requirements.md
        priority: 1
        lastReviewedAt: 2026-07-16
  visual:
    sources: []
  content:
    sources:
      - ref: product/order-history-requirements.md
        priority: 1
        lastReviewedAt: 2026-07-16
  components:
    sources:
      - ref: .design-system/component-spec.json
        priority: 1
        lastReviewedAt: 2026-07-16
  tokens:
    sources:
      - ref: tokens/source/tokens.json
        priority: 1
        lastReviewedAt: 2026-07-16
  runtime:
    sources: []
  dataSafety:
    sources: []

screen:
  name: OrderHistoryScreen
  recipe: list-screen
  route: /orders

screenModel:
  contentPattern: list
  presentation: pushed-route
  riskProfile: normal

intent:
  primaryGoal: 사용자가 최근 주문 내역을 확인한다
  secondaryGoal: 주문 상세로 이동한다

content:
  title: 주문 내역
  description: 최근 주문한 상품을 확인할 수 있습니다
  emptyTitle: 아직 주문 내역이 없습니다
  emptyDescription: 상품을 주문하면 이곳에서 확인할 수 있습니다
  errorTitle: 주문 내역을 불러오지 못했습니다
  errorDescription: 네트워크 상태를 확인한 뒤 다시 시도해주세요

data:
  entity: Order
  itemFields:
    - orderNumber
    - orderedAt
    - status
    - totalPrice

dataPolicy:
  sensitivity: personal
  projectionBoundary: OrderHistoryViewModel
  allowedInRouteParams:
    - orderId
  allowedInFixtures:
    - syntheticOrderSummary
  allowedInLogs: []
  allowedInScreenshots:
    - syntheticOrderSummary

states:
  required:
    - loading
    - empty
    - error
    - success

actions:
  itemPress:
    label: 주문 상세 보기
  retry:
    label: 다시 시도

behaviorAssertions:
  - error state exposes retry
  - item press routes by stable orderId

validationScope:
  changedRoots:
    - src/screens/order-history
  repositoryWideRequired: true
  comparableBaselineEvidence:

constraints:
  useOnlyDesignSystemComponents: true
  noRawStyles: true
  noNewTokens: true
  requireStories: true
  requireAccessibility: true
  requireComplianceReport: true
